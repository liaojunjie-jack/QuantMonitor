# ==================================================
# QuantMonitor 全局配置文件
# 所有的配置都在这里修改，每个配置项都有详细注释说明
# 详细配置教程：README.md里的「从零到一超详细配置&运行步骤」
# ==================================================

# --------------------------
# 监控配置
# --------------------------
monitors:
  # ==================================================
  # 市场异动监控：监控标的的价格涨跌幅，异动的时候触发告警
  # ==================================================
  market:
    enabled: true  # 是否启用市场监控，true=启用，false=关闭
    interval: 300  # 监控检查的间隔，单位：秒，默认5分钟，也就是每5分钟检查一次
    
    # 你要监控的标的列表，下面是示例，你可以修改、删除或者新增
    targets:
      # 示例1：监控上证指数，单日跌幅超过5%告警
      - symbol: 000001.SS  # 标的代码：A股写6位代码即可，也可以带.SS/.SZ后缀；美股写股票代码；加密货币写BTC-USD这种
        name: 上证指数      # 标的的名字，告警的时候会显示这个名字，方便你识别
        threshold: -5.0    # 告警阈值：负数=监控跌幅，比如-5.0就是单日跌幅超过5%告警；正数=监控涨幅，比如10.0就是单日涨幅超过10%告警
      
      # 示例2：监控深证成指，单日跌幅超过5.5%告警
      - symbol: 399001.SZ
        name: 深证成指
        threshold: -5.5
      
      # 示例3：监控沪深300ETF，单日跌幅超过6%告警
      - symbol: 510300.SH
        name: 沪深300ETF
        threshold: -6.0
      
      # 示例4：监控英伟达，单日跌幅超过10%告警
      - symbol: NVDA
        name: 英伟达
        threshold: -10.0
      
      # 示例5：监控特斯拉，单日跌幅超过12%告警
      - symbol: TSLA
        name: 特斯拉
        threshold: -12.0
      
      # 示例6：监控比特币，单日跌幅超过15%告警
      - symbol: BTC-USD
        name: 比特币
        threshold: -15.0
      
      # 示例7：监控以太坊，单日跌幅超过18%告警
      - symbol: ETH-USD
        name: 以太坊
        threshold: -18.0

  # ==================================================
  # 风险指标监控：后续开发中，暂时不用管
  # ==================================================
  risk:
    enabled: false
    # 待开发

  # ==================================================
  # 策略运行监控：后续开发中，暂时不用管
  # ==================================================
  strategy:
    enabled: false
    # 待开发

# --------------------------
# 告警配置
# --------------------------
alert:
  enabled: true  # 是否启用告警，true=启用，false=关闭
  channels:
    # ==================================================
    # 企业微信机器人告警：最常用的告警渠道，群聊接收通知
    # 怎么获取Webhook？看README里的步骤5
    # ==================================================
    wecom:
      enabled: false  # 是否启用企业微信告警，true=启用，false=关闭
      webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your-key-here"  # 你的企业微信机器人Webhook地址
    
    # ==================================================
    # 飞书机器人告警：和企业微信类似，飞书群聊接收通知
    # ==================================================
    feishu:
      enabled: false  # 是否启用飞书告警，true=启用，false=关闭
      webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/your-key-here"  # 你的飞书机器人Webhook地址
    
    # ==================================================
    # Bark iOS推送：iPhone用户专用，手机接收实时推送
    # 怎么获取设备Key？看README里的步骤6
    # ==================================================
    bark:
      enabled: false  # 是否启用Bark告警，true=启用，false=关闭
      device_key: "your-device-key-here"  # 你的Bark设备Key
    
    # ==================================================
    # 邮件告警：通过邮件接收告警通知
    # ==================================================
    email:
      enabled: false  # 是否启用邮件告警，true=启用，false=关闭
      smtp_server: "smtp.qq.com"  # 邮箱的SMTP服务器
      smtp_port: 587  # SMTP端口
      username: "your-email@qq.com"  # 你的邮箱账号
      password: "your-password"  # 你的邮箱授权码
      to: "target-email@example.com"  # 接收告警的邮箱
